spring.application.name=fleet-api
server.port=8080

# SQLite：数据库文件落在项目目录，零安装
spring.datasource.url=jdbc:sqlite:fleet.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA 自动建表（学习项目用 update，生产用迁移工具）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# JWT 密钥：32 字节起。默认值只供本地学习，部署时用环境变量覆盖：
#   set FLEET_JWT_SECRET=<随机 32 字节>   (Windows)
#   export FLEET_JWT_SECRET=<随机 32 字节> (Linux/macOS)
fleet.jwt-secret=${FLEET_JWT_SECRET:fleetkeeper-learning-secret-key-32bytes!}

# 演示账号同样外置，避免把凭据钉死在源码里
fleet.admin-user=${FLEET_ADMIN_USER:admin}
fleet.admin-password=${FLEET_ADMIN_PASSWORD:admin123}

# 接单 demo 的业务参数：每 IP 每分钟提交上限、同单去重窗口（秒）
fleet.order.rate-limit=${FLEET_ORDER_RATE_LIMIT:20}
fleet.order.dedupe-seconds=${FLEET_ORDER_DEDUPE_SECONDS:600}
