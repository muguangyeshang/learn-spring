spring.application.name=fleet-api
server.port=8080

# SQLite：数据库文件落在项目目录，零安装
spring.datasource.url=jdbc:sqlite:fleet.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA 自动建表（学习项目用 update，生产用迁移工具）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# JWT 密钥：32 字节起；学习项目写死，生产必须走环境变量
fleet.jwt-secret=fleetkeeper-learning-secret-key-32bytes!
